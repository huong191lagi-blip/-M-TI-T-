<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 280" width="100%" height="100%">
  <defs>
    <!-- Skin tone background gradient -->
    <radialGradient id="faceGrad" cx="50%" cy="45%" r="55%">
      <stop offset="0%" stopColor="#fdf2e9" />
      <stop offset="70%" stopColor="#fed7aa" />
      <stop offset="100%" stopColor="#fdba74" />
    </radialGradient>
    <!-- Lip gradient -->
    <linearGradient id="upperLipGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stopColor="#e11d48" />
      <stop offset="60%" stopColor="#be123c" />
      <stop offset="100%" stopColor="#9f1239" />
    </linearGradient>
    <linearGradient id="lowerLipGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stopColor="#f43f5e" />
      <stop offset="50%" stopColor="#e11d48" />
      <stop offset="100%" stopColor="#be123c" />
    </linearGradient>
    <!-- Tongue gradient -->
    <linearGradient id="frontTongueGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stopColor="#fb7185" />
      <stop offset="100%" stopColor="#e11d48" />
    </linearGradient>
    <!-- Subtle shadow -->
    <filter id="mouthShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Background Base Canvas -->
  <rect width="400" height="280" rx="16" fill="#0b0f19" />

  <!-- Face / Jaw background area -->
  <path d="M 60 20 Q 200 10 340 20 Q 350 140 310 210 Q 200 270 90 210 Q 50 140 60 20 Z" fill="url(#faceGrad)" opacity="0.95" />

  <!-- Philtrum (Rãnh nhân trung) -->
  <path d="M 190 40 Q 192 75 186 90" stroke="#fb923c" stroke-width="2.5" stroke-linecap="round" fill="none" opacity="0.6" />
  <path d="M 210 40 Q 208 75 214 90" stroke="#fb923c" stroke-width="2.5" stroke-linecap="round" fill="none" opacity="0.6" />

  <!-- Mouth Group with Shadow -->
  <g filter="url(#mouthShadow)">
    <!-- Oral cavity dark background -->
    <path d="M 105 130 Q 145 108 200 108 Q 255 108 295 130 Q 260 162 200 162 Q 140 162 105 130 Z" fill="#1e1b4b" />

    <!-- Upper teeth row (Hàm răng trên) -->
    <g fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2">
      <!-- Central incisors -->
      <path d="M 188 110 L 188 126 Q 194 128 200 128 L 200 110 Z" />
      <path d="M 200 110 L 200 128 Q 206 128 212 126 L 212 110 Z" />
      <!-- Lateral incisors -->
      <path d="M 176 112 L 176 124 Q 182 125 188 126 L 188 111 Z" />
      <path d="M 212 111 L 212 126 Q 218 125 224 124 L 224 112 Z" />
      <!-- Canines & premolars -->
      <path d="M 164 116 L 165 122 Q 170 123 176 124 L 176 113 Z" />
      <path d="M 224 113 L 224 124 Q 230 123 235 122 L 236 116 Z" />
    </g>

    <!-- Tongue visible in the mouth (Thân lưỡi nhìn thẳng) -->
    <path d="M 130 148 Q 200 134 270 148 Q 240 160 200 160 Q 160 160 130 148 Z" fill="url(#frontTongueGrad)" stroke="#f43f5e" stroke-width="1.5" />

    <!-- Lower teeth row (Hàm răng dưới hơi nhô nhẹ) -->
    <g fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1">
      <path d="M 186 142 L 186 148 Q 193 147 200 147 L 200 142 Z" />
      <path d="M 200 142 L 200 147 Q 207 147 214 142 L 214 142 Z" />
      <path d="M 176 144 L 176 149 Q 181 148 186 148 L 186 143 Z" />
      <path d="M 214 143 L 214 148 Q 219 148 224 144 L 224 144 Z" />
    </g>

    <!-- Upper Lip (Môi trên - đường cong cánh cung Cupid) -->
    <path d="M 100 130 Q 145 116 175 106 Q 192 100 200 106 Q 208 100 225 106 Q 255 116 300 130 Q 255 114 200 114 Q 145 114 100 130 Z" fill="url(#upperLipGrad)" stroke="#9f1239" stroke-width="1.5" />

    <!-- Lower Lip (Môi dưới - mở vừa phải, hơi kéo ngang) -->
    <path d="M 100 130 Q 145 156 200 156 Q 255 156 300 130 Q 260 182 200 182 Q 140 182 100 130 Z" fill="url(#lowerLipGrad)" stroke="#be123c" stroke-width="1.5" />
  </g>

  <!-- Corner of mouth accents (Khóe môi cười nhẹ đặc trưng âm /e/) -->
  <path d="M 94 130 Q 100 130 106 132" stroke="#881337" stroke-width="3" stroke-linecap="round" fill="none" />
  <path d="M 306 130 Q 300 130 294 132" stroke="#881337" stroke-width="3" stroke-linecap="round" fill="none" />

  <!-- Anatomical annotations & labels -->
  <!-- Left callout: Khóe môi -->
  <g>
    <line x1="90" y1="130" x2="35" y2="105" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="3 3" />
    <circle cx="90" cy="130" r="3.5" fill="#38bdf8" />
    <rect x="15" y="85" width="95" height="24" rx="6" fill="#0f172a" stroke="#0284c7" stroke-width="1" />
    <text x="62" y="101" fill="#38bdf8" font-size="9" font-family="sans-serif" font-weight="bold" text-anchor="middle">Khóe môi bè nhẹ</text>
  </g>

  <!-- Right callout: Độ mở hàm -->
  <g>
    <line x1="295" y1="140" x2="345" y2="105" stroke="#34d399" stroke-width="1.5" stroke-dasharray="3 3" />
    <circle cx="295" cy="140" r="3.5" fill="#34d399" />
    <rect x="295" y="85" width="95" height="24" rx="6" fill="#0f172a" stroke="#059669" stroke-width="1" />
    <text x="342" y="101" fill="#34d399" font-size="9" font-family="sans-serif" font-weight="bold" text-anchor="middle">Độ mở hàm vừa (~1cm)</text>
  </g>

  <!-- Bottom callout: Vị trí lưỡi -->
  <g>
    <line x1="200" y1="152" x2="200" y2="215" stroke="#f472b6" stroke-width="1.5" stroke-dasharray="3 3" />
    <circle cx="200" cy="152" r="3.5" fill="#f472b6" />
    <rect x="110" y="215" width="180" height="24" rx="6" fill="#0f172a" stroke="#db2777" stroke-width="1" />
    <text x="200" y="231" fill="#f472b6" font-size="9.5" font-family="sans-serif" font-weight="bold" text-anchor="middle">Đầu lưỡi chạm chân răng dưới</text>
  </g>

  <!-- Title Badge Top Left -->
  <rect x="15" y="15" width="140" height="22" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1" />
  <text x="85" y="30" fill="#e2e8f0" font-size="10" font-family="sans-serif" font-weight="bold" text-anchor="middle">Khuôn môi âm /e/ (Front View)</text>
</svg>
